id: io.github.obsidiannetwork.ObsidianSSH
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: obsidianssh

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: obsidianssh
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/obsidianssh/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --offline --locked -p obsidianssh-app
      - install -Dm755 target/release/obsidianssh /app/bin/obsidianssh
      - install -Dm644 resources/io.github.obsidiannetwork.ObsidianSSH.desktop /app/share/applications/io.github.obsidiannetwork.ObsidianSSH.desktop
      - install -Dm644 resources/io.github.obsidiannetwork.ObsidianSSH.metainfo.xml /app/share/metainfo/io.github.obsidiannetwork.ObsidianSSH.metainfo.xml
      - install -Dm644 resources/logo_64.png /app/share/icons/hicolor/64x64/apps/io.github.obsidiannetwork.ObsidianSSH.png
      - install -Dm644 resources/logo_128.png /app/share/icons/hicolor/128x128/apps/io.github.obsidiannetwork.ObsidianSSH.png
      - install -Dm644 resources/logo_256.png /app/share/icons/hicolor/256x256/apps/io.github.obsidiannetwork.ObsidianSSH.png
    sources:
      # Pinned to the post-v0.8.0 commit that adds the AppStream metainfo, the
      # desktop file and the Wayland app_id fix (all absent from the v0.8.0
      # tag). Cargo.lock is unchanged from v0.8.0, so cargo-sources.json holds.
      - type: git
        url: https://github.com/ObsidianNetwork/ObsidianSSH.git
        commit: ee17d6b49632105a698eef313d0ee6f630350727
      - cargo-sources.json
