name: Nightly

# Rolling per-commit build of just the main `obsidianssh` app (no plugins,
# and no Windows or Linux installers; macOS gets a .dmg because the
# bundle is what gives the app its code identity, see the job below).
# Each successful run replaces the `nightly-latest`
# GitHub Release so the link to the latest unstable binary never moves.
#
# The rolling tag was `nightly` until 2026-07-16: a release published
# while "release immutability" was enabled burned that tag name
# PERMANENTLY (GitHub reserves a tag ever used by an immutable release,
# even after the release and tag are deleted and the setting is turned
# off). Never enable release immutability on this repo while a rolling
# tag exists, and never reuse the name `nightly` for a tag. The mirror
# snapshot keeps the `releases/nightly.json` name so pre-rename
# binaries still find updates through the Auto mirror fallback.

on:
  push:
    branches: [main]
    # Skip pure docs / screenshot / signaling-worker churn since the
    # binary doesn't change. CI still runs on those via ci.yml.
    paths-ignore:
      - '**/*.md'
      - 'resources/screen_*.png'
      - 'resources/screen_*.gif'
      - 'signaling-worker/**'
      - '.github/workflows/release*.yml'

# Cancel an in-flight nightly when a newer commit lands. The rolling
# `nightly-latest` release would just be overwritten anyway, so the
# older run is wasted compute.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Same signaling endpoint the release builds bake in, so a nightly
  # is exercised against the same server the user-facing tagged
  # builds use.
  OBSIDIANSSH_SIGNALING_URL: ${{ secrets.OBSIDIANSSH_SIGNALING_URL }}
  OBSIDIANSSH_SIGNALING_TOKEN: ${{ secrets.OBSIDIANSSH_SIGNALING_TOKEN }}
  # Stamp the binary as a nightly build at the exact commit. `build.rs`
  # bakes these into OBSIDIANSSH_CHANNEL / OBSIDIANSSH_GIT_SHA so the in-app
  # nightly updater can tell what it's running and compare against the
  # rolling release's target commit.
  OBSIDIANSSH_BUILD_CHANNEL: nightly
  OBSIDIANSSH_GIT_SHA: ${{ github.sha }}

jobs:
  build-linux-x86:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libgtk-3-dev libwayland-dev libxkbcommon-dev
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: linux-x86-nightly-ubuntu-22.04-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked --profile release-with-symbols -p obsidianssh-app
      # Split debuginfo out of the binary, then strip it. What ships
      # carries no more symbols than `strip = true` left it, plus one
      # added `.gnu_debuglink` section naming its symbol file; what is
      # NEW is that the symbols survive as their own asset, so a `gdb`
      # backtrace from the field can be resolved instead of printing
      # `??` (issue #104). gdb checks the debuglink CRC, so the pair
      # only works together: whoever collects a stack downloads the
      # binary and its `-debug.tar.xz` in the same sitting, because
      # `nightly-latest` is replaced on every push to main.
      - name: Split debug symbols
        run: |
          set -euo pipefail
          BIN=target/release-with-symbols/obsidianssh
          objcopy --only-keep-debug "$BIN" obsidianssh.debug
          objcopy --strip-all --add-gnu-debuglink=obsidianssh.debug "$BIN" obsidianssh-stripped
          # -T0: xz defaults to one thread, and a release DWARF blob
          # is big enough for that to cost minutes of nightly time.
          XZ_OPT=-T0 tar cJf obsidianssh-nightly-linux-x86_64-debug.tar.xz obsidianssh.debug
      - name: Package tarball + bare binary
        run: |
          mkdir -p dist
          cp obsidianssh-stripped dist/obsidianssh
          cp README.md resources/logo_64.png resources/obsidianssh.desktop dist/
          cd dist && tar czf ../obsidianssh-nightly-linux-x86_64.tar.gz *
          # Bare binary asset for in-app self-update (no installer for nightly).
          cd .. && cp obsidianssh-stripped obsidianssh-nightly-linux-x86_64.bin
      - uses: actions/upload-artifact@v7
        with:
          name: obsidianssh-nightly-linux-x86_64
          path: |
            obsidianssh-nightly-linux-x86_64.tar.gz
            obsidianssh-nightly-linux-x86_64.bin
            obsidianssh-nightly-linux-x86_64-debug.tar.xz

  build-linux-arm:
    name: Linux ARM64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libgtk-3-dev libwayland-dev libxkbcommon-dev
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: linux-arm-nightly-ubuntu-22.04-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked --profile release-with-symbols -p obsidianssh-app
      # Same split as the x86_64 job above; see the comment there.
      - name: Split debug symbols
        run: |
          set -euo pipefail
          BIN=target/release-with-symbols/obsidianssh
          objcopy --only-keep-debug "$BIN" obsidianssh.debug
          objcopy --strip-all --add-gnu-debuglink=obsidianssh.debug "$BIN" obsidianssh-stripped
          # -T0: xz defaults to one thread, and a release DWARF blob
          # is big enough for that to cost minutes of nightly time.
          XZ_OPT=-T0 tar cJf obsidianssh-nightly-linux-aarch64-debug.tar.xz obsidianssh.debug
      - name: Package tarball + bare binary
        run: |
          mkdir -p dist
          cp obsidianssh-stripped dist/obsidianssh
          cp README.md resources/logo_64.png resources/obsidianssh.desktop dist/
          cd dist && tar czf ../obsidianssh-nightly-linux-aarch64.tar.gz *
          cd .. && cp obsidianssh-stripped obsidianssh-nightly-linux-aarch64.bin
      - uses: actions/upload-artifact@v7
        with:
          name: obsidianssh-nightly-linux-aarch64
          path: |
            obsidianssh-nightly-linux-aarch64.tar.gz
            obsidianssh-nightly-linux-aarch64.bin
            obsidianssh-nightly-linux-aarch64-debug.tar.xz

  build-macos-arm:
    name: macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: macos-arm-nightly-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked --release -p obsidianssh-app
      - name: Package tarball + bare binary
        run: |
          mkdir -p dist
          cp target/release/obsidianssh dist/
          cp README.md resources/logo_64.png dist/
          # Gatekeeper steps, including what the bare .bin below is for.
          cp resources/INSTALL-macOS.md dist/
          cd dist && tar czf ../obsidianssh-nightly-macos-aarch64.tar.gz *
          cd .. && cp target/release/obsidianssh obsidianssh-nightly-macos-aarch64.bin
      # The nightly ships a .dmg even though it ships no other installer,
      # because on macOS the bundle is not packaging, it is the program.
      # A bare binary runs as a CLI process with a different CODE
      # IDENTITY, and the Keychain ACL is keyed on exactly that, so
      # Touch ID unlock and anything else identity-scoped behaves
      # differently from the app people actually install. Testing a
      # nightly on a Mac was therefore testing something else.
      - name: Build .app bundle
        run: |
          set -euo pipefail
          # The crate version, not a tag: a nightly has no tag, and
          # CFBundleShortVersionString must stay a plain x.y.z. The
          # commit it was built from is in the release notes.
          VERSION=$(grep -m1 '^version' crates/obsidianssh-app/Cargo.toml | cut -d'"' -f2)
          APP="ObsidianSSH.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/obsidianssh "$APP/Contents/MacOS/obsidianssh"
          cp resources/ObsidianSSH.icns "$APP/Contents/Resources/ObsidianSSH.icns"
          sed "s/__VERSION__/${VERSION}/g" resources/Info.plist > "$APP/Contents/Info.plist"
          # Ad-hoc only, never the Developer ID path the release job
          # takes: notarization is a round trip to Apple per submission,
          # and this workflow runs on every push to main.
          codesign --force --deep --sign - "$APP"
      - name: Build .dmg
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING"
          mv ObsidianSSH.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          cp resources/INSTALL-macOS.md "$STAGING/"
          # Sized from the measured content plus headroom, never left to
          # hdiutil's own estimate: see the same step in release.yml and
          # the `create failed - No space left on device` note in the
          # release skill's gotchas. `target/` is deliberately NOT
          # reclaimed here the way the release job reclaims it, because
          # this workflow caches that directory and emptying it would
          # poison the cache for every later run.
          df -h /
          SIZE_MB=$(( $(du -sm "$STAGING" | cut -f1) + 300 ))
          echo "staging is $(du -sh "$STAGING" | cut -f1), image sized ${SIZE_MB}m"
          hdiutil create -volname "Obsidian SSH Nightly" -srcfolder "$STAGING" \
            -size "${SIZE_MB}m" -ov -format UDZO obsidianssh-nightly-macos-aarch64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: obsidianssh-nightly-macos-aarch64
          path: |
            obsidianssh-nightly-macos-aarch64.tar.gz
            obsidianssh-nightly-macos-aarch64.bin
            obsidianssh-nightly-macos-aarch64.dmg

  build-windows-x86:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: windows-x86-nightly-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked --profile release-with-split-debuginfo-packed -p obsidianssh-app
      - name: Package zip & pdb's + bare exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\release-with-split-debuginfo-packed\obsidianssh.exe dist\
          Copy-Item README.md dist\
          Copy-Item resources\logo_64.png dist\
          Compress-Archive -Path dist\* -DestinationPath obsidianssh-nightly-windows-x86_64.zip
          New-Item -ItemType Directory -Force -Path pdb
          Copy-Item -Path target\release-with-split-debuginfo-packed\*.pdb pdb\
          Compress-Archive -Path pdb\* -DestinationPath obsidianssh-nightly-windows-x86_64-pdb.zip
          # Bare exe asset for in-app self-update (no installer for nightly).
          Copy-Item target\release-with-split-debuginfo-packed\obsidianssh.exe obsidianssh-nightly-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: obsidianssh-nightly-windows-x86_64
          path: |
            obsidianssh-nightly-windows-x86_64.zip
            obsidianssh-nightly-windows-x86_64-pdb.zip
            obsidianssh-nightly-windows-x86_64.exe

  build-windows-arm:
    name: Windows ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: windows-arm-nightly-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked --release --target aarch64-pc-windows-msvc -p obsidianssh-app
      - name: Package portable zip + bare exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\aarch64-pc-windows-msvc\release\obsidianssh.exe dist\
          Copy-Item README.md dist\
          Copy-Item resources\logo_64.png dist\
          Compress-Archive -Path dist\* -DestinationPath obsidianssh-nightly-windows-aarch64.zip
          # Bare exe asset for in-app self-update (no installer for nightly).
          Copy-Item target\aarch64-pc-windows-msvc\release\obsidianssh.exe obsidianssh-nightly-windows-aarch64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: obsidianssh-nightly-windows-aarch64
          path: |
            obsidianssh-nightly-windows-aarch64.zip
            obsidianssh-nightly-windows-aarch64.exe

  publish:
    name: Publish nightly release
    runs-on: ubuntu-latest
    needs:
      - build-linux-x86
      - build-linux-arm
      - build-macos-arm
      - build-windows-x86
      - build-windows-arm
    steps:
      - uses: actions/checkout@v5
        with:
          # Need the tag refs locally so `git tag -f nightly` finds
          # the previous one to overwrite, and so the SHA shows up in
          # release notes.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Compute build metadata
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short=8 HEAD)
          STAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

      # Detached Ed25519 signature per asset (`<asset>.sig`, base64).
      # The in-app nightly self-update verifies the bare binary against
      # the baked-in PROD_PUBKEY before swapping it in.
      - uses: dtolnay/rust-toolchain@stable
      - name: Sign nightly assets
        env:
          OBSIDIANSSH_SIGNING_KEY: ${{ secrets.OBSIDIANSSH_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cargo build --locked --release -p obsidianssh-plugin-signer
          for f in dist/*; do
            case "$f" in *.sig) continue ;; esac
            ./target/release/obsidianssh-plugin-signer sign "$f" > "$f.signinfo"
            grep '^signature_b64' "$f.signinfo" | awk '{print $3}' > "$f.sig"
            rm "$f.signinfo"
          done
      - name: Replace nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Drop any previous nightly release and its tag (suppress 404
          # so the very first run still succeeds). `--cleanup-tag`
          # nukes the rolling tag so the next `gh release create` can
          # recreate it pointing at the new commit.
          gh release delete nightly-latest --yes --cleanup-tag 2>/dev/null || true

          NOTES=$(cat <<NOTE
          Automated nightly build of the \`obsidianssh\` app, no plugins or installers.

          - **Commit:** \`${{ github.sha }}\` (\`${{ steps.meta.outputs.sha_short }}\`)
          - **Built:** ${{ steps.meta.outputs.stamp }}

          Each push to \`main\` overwrites this release. For stable
          builds and Windows installers, grab the [latest tagged
          release](https://github.com/${{ github.repository }}/releases/latest).
          NOTE
          )

          gh release create nightly-latest \
            --prerelease \
            --title "Nightly (${{ steps.meta.outputs.sha_short }})" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            dist/*

  # Sync the published assets + API snapshots to the download mirror
  # (dl.oryxis.app / dl-cn.oryxis.app), the Auto fallback for networks
  # where GitHub is blocked (mainland China). Layout contract lives in
  # publish-mirror.yml and net_mirror.rs.
  mirror:
    name: Publish to download mirror
    needs: [publish]
    uses: ./.github/workflows/publish-mirror.yml
    with:
      tag: nightly-latest
    secrets: inherit
